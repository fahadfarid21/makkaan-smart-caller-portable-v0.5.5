name: Build and verify Makkaan Sales Sidecar

on:
  push:
    branches:
      - main
      - feat/smart-caller-v0.6.2-fresh-notes-ai-brief
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Extract bootstrap package, apply maintained overrides and deterministic CRM safety patches
        shell: bash
        run: |
          set -euo pipefail
          test -f build-inputs/seed-extension.zip
          rm -rf build
          mkdir -p build/package
          python3 - <<'PY'
          import pathlib, zipfile
          archive = pathlib.Path('build-inputs/seed-extension.zip')
          root = pathlib.Path('build/package').resolve()
          with zipfile.ZipFile(archive) as zf:
              for item in zf.infolist():
                  name = item.filename.replace('\\', '/')
                  target = (root / name).resolve()
                  if root not in target.parents and target != root:
                      raise SystemExit(f'Unsafe archive path: {item.filename!r}')
                  if item.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(zf.read(item))
          PY
          cp -a source-overrides/. build/package/
          python3 .github/scripts/apply-crm-safety-patches.py build/package
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find build/package -maxdepth 1 -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
      - name: Verify manifest, assets and release safety invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-release.py build/package
      - name: Record build provenance and automated checks
        shell: bash
        run: |
          set -euo pipefail
          cat > build/package/PERFORMED-TESTS.txt <<EOF
          MAKKAAN SALES SIDECAR v0.6.4 — AUTOMATED VALIDATION REPORT
          Source commit: $GITHUB_SHA
          Workflow run: $GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT)
          This report is generated only after the release verification step has passed.

          PASS — Manifest V3 JSON and v0.6.4 version.
          PASS — all manifest entry points and local HTML script/style references exist.
          PASS — Node.js syntax checks for all top-level packaged JavaScript files.
          PASS — Connected/Not Connected call outcomes and Call-only Activity Type guardrails.
          PASS — fresh CRM note replaces Comments; old comments are not appended or timestamped by the extension.
          PASS — update path excludes Qualification Status, owner, source and contact details.
          PASS — bounded post-save read-back and no automatic resubmission when verification is uncertain.
          PASS — required lead-specific AI brief sections and anti-invention guidance.
          PASS — follow-up completion/KPI integration, local reminder design and no global runtime interception.
          PASS — Quick Investor Calculator full-width placement invariant.
          PASS — required documentation is versioned for v0.6.4.

          NOT VERIFIED — live Chrome/Brave rendering or accessibility; live authenticated Prop 360 save behavior; live Gemini API success; current market/property assumptions; accuracy of manual KPI entries. Complete MANUAL-TEST-CHECKLIST.txt with an authorized test record before production use.
          EOF
      - name: Package and verify portable extension ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd build/package
          zip -qr ../../dist/Makkaan-Smart-Caller-Complete-Portable-v0.6.4.zip .
          cd ../..
          unzip -t dist/Makkaan-Smart-Caller-Complete-Portable-v0.6.4.zip
          sha256sum dist/Makkaan-Smart-Caller-Complete-Portable-v0.6.4.zip | tee dist/SHA256SUMS.txt
      - name: Upload verified portable extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Makkaan-Smart-Caller-Complete-Portable-v0.6.4
          path: |
            dist/Makkaan-Smart-Caller-Complete-Portable-v0.6.4.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
