name: Build Smart Caller portable ZIP

on:
  push:
    branches:
      - feat/smart-caller-v0.6.0-daily-kpi-coach
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Extract v0.5.5 base package and apply v0.6.0 overrides
        shell: bash
        run: |
          set -euo pipefail
          test -f Makkaan-Sales-Sidecar-Portable-v0.5.5.zip
          rm -rf build
          mkdir -p build/package
          unzip -q Makkaan-Sales-Sidecar-Portable-v0.5.5.zip -d build/package
          cp -a source-overrides/. build/package/
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('build/package/manifest.json','utf8'));if(m.manifest_version!==3||m.version!=='0.6.0')process.exit(1);for(const p of [m.background?.service_worker,m.options_page,m.side_panel?.default_path,...(m.content_scripts||[]).flatMap(x=>x.js||[]),...(Object.values(m.action?.default_icon||{})),...(Object.values(m.icons||{}))])if(p&&!fs.existsSync('build/package/'+p)){console.error('Missing manifest file:',p);process.exit(2)}"
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find build/package -maxdepth 1 -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
      - name: Verify required features and package
        shell: bash
        run: |
          set -euo pipefail
          test -f build/package/daily-kpi-coach.js
          grep -q 'id="view-desk"' build/package/sidepanel.html
          grep -q 'daily-kpi-coach.js' build/package/sidepanel.html
          grep -q 'Investor Mode' build/package/README.md
          cd build/package
          zip -qr ../../Makkaan-Smart-Caller-Complete-Portable-v0.6.0.zip .
          cd ../..
          unzip -t Makkaan-Smart-Caller-Complete-Portable-v0.6.0.zip
          sha256sum Makkaan-Smart-Caller-Complete-Portable-v0.6.0.zip | tee SHA256SUMS.txt
      - name: Upload portable release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Makkaan-Smart-Caller-Complete-Portable-v0.6.0
          path: |
            Makkaan-Smart-Caller-Complete-Portable-v0.6.0.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
