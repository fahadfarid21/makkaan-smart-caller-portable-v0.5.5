name: Build Smart Caller portable ZIP

on:
  push:
    branches:
      - feat/smart-caller-v0.6.0-daily-kpi-coach
      - feat/smart-caller-v0.6.1-follow-up-workflow
      - feat/smart-caller-v0.6.2-fresh-notes-ai-brief
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Extract base package, apply overrides and deterministic CRM patches and v0.6.3 Investor UI
        shell: bash
        run: |
          set -euo pipefail
          test -f Makkaan-Sales-Sidecar-Portable-v0.5.5.zip
          rm -rf build
          mkdir -p build/package
          python3 - <<'PY'
          import pathlib, zipfile
          archive = pathlib.Path('Makkaan-Sales-Sidecar-Portable-v0.5.5.zip')
          root = pathlib.Path('build/package')
          with zipfile.ZipFile(archive) as zf:
              for item in zf.infolist():
                  # The original Windows-created ZIP stores backslashes as separators.
                  name = item.filename.replace('\\', '/')
                  target = (root / name).resolve()
                  if root.resolve() not in target.parents and target != root.resolve():
                      raise SystemExit(f'Unsafe archive path: {item.filename!r}')
                  if item.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(zf.read(item))
          PY
          cp -a source-overrides/. build/package/
          python3 .github/scripts/apply-v062-patches.py build/package
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('build/package/manifest.json','utf8'));if(m.manifest_version!==3||m.version!=='0.6.3')process.exit(1);for(const p of [m.background?.service_worker,m.options_page,m.side_panel?.default_path,...(m.content_scripts||[]).flatMap(x=>x.js||[]),...(Object.values(m.action?.default_icon||{})),...(Object.values(m.icons||{}))])if(p&&!fs.existsSync('build/package/'+p)){console.error('Missing manifest file:',p);process.exit(2)}"
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find build/package -maxdepth 1 -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
      - name: Verify required features and package
        shell: bash
        run: |
          set -euo pipefail
          test -f build/package/daily-kpi-coach.js
          test -f build/package/follow-up-workflow.js
          grep -q 'follow-up-workflow.js' build/package/sidepanel.html
          grep -q 'id="view-desk"' build/package/sidepanel.html
          grep -q 'daily-kpi-coach.js' build/package/sidepanel.html
          grep -q '0.6.3</span>' build/package/sidepanel.html
          grep -q 'const newComment = note || null;' build/package/content.js
          ! grep -q 'oldComment' build/package/content.js
          grep -q 'LEAD SNAPSHOT' build/package/sidepanel.js
          ! grep -q 'chrome.runtime.sendMessage = function' build/package/follow-up-workflow.js
          grep -q 'Investor Mode' build/package/README.md
          grep -q 'mountQuickInvestorCalculator' build/package/investor-mode.js
          grep -q 'quickInvestorCalc' build/package/investor-mode.js
          cd build/package
          zip -qr ../../Makkaan-Smart-Caller-Complete-Portable-v0.6.3.zip .
          cd ../..
          unzip -t Makkaan-Smart-Caller-Complete-Portable-v0.6.3.zip
          sha256sum Makkaan-Smart-Caller-Complete-Portable-v0.6.3.zip | tee SHA256SUMS.txt
      - name: Upload portable release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Makkaan-Smart-Caller-Complete-Portable-v0.6.3
          path: |
            Makkaan-Smart-Caller-Complete-Portable-v0.6.3.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
